<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Submissions Viewer</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; --danger: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid var(--border); }
        .card-header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--bg); padding-bottom: 12px; margin-bottom: 15px; }
        .meta-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; background: #f1f5f9; padding: 12px; border-radius: 6px; }
        .meta-item { font-size: 14px; }
        .meta-item strong { display: block; color: #64748b; font-size: 12px; text-transform: uppercase; }
        .items-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .items-table th { background: #f8fafc; text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
        .items-table td { padding: 8px; border-bottom: 1px solid var(--border); }
        .total-row { font-weight: bold; font-size: 16px; text-align: right; margin-top: 15px; }
        .btn-download { display: inline-block; padding: 8px 14px; background: var(--primary); color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 13px; margin-top: 10px; cursor: pointer; border: none; }
        .btn-download:hover { background: #1d4ed8; }
        .btn-delete { display: inline-block; padding: 8px 14px; background: var(--danger); color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 13px; margin-top: 10px; margin-left: 10px; cursor: pointer; border: none; }
        .btn-delete:hover { background: #dc2626; }
        .btn-refresh { padding: 10px 18px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .status-msg { padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; background: #e2e8f0; }
        .no-data { text-align: center; color: #64748b; padding: 40px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 Procurement Submissions Dashboard</h1>
        <button class="btn-refresh" onclick="loadSubmissions()">🔄 Refresh Data</button>
    </div>

    <div id="statusContainer" class="status-msg">Loading records...</div>
    <div id="submissionsContainer"></div>
</div>

<script>
    const CONFIG = {
        owner: 'projection-solutions',
        repo: 'DETR',
        branch: 'main',
        path: 'data.json',
        pat: '' // Left blank so no token is hardcoded into your repository source code
    };

    const API_URL = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;

    async function loadSubmissions() {
        const statusEl = document.getElementById('statusContainer');
        const container = document.getElementById('submissionsContainer');
        
        statusEl.style.display = 'block';
        statusEl.className = 'status-msg';
        statusEl.innerText = 'Fetching live data...';
        container.innerHTML = '';

        try {
            const res = await fetch(`./data.json?_ts=${Date.now()}`);

            if (res.status === 404) {
                statusEl.style.display = 'none';
                container.innerHTML = '<div class="card no-data"><h3>data.json not found.</h3><p>Make sure data.json exists in the root repository.</p></div>';
                return;
            }

            if (!res.ok) {
                throw new Error(`Failed to load data.json (Status: ${res.status})`);
            }

            const submissions = await res.json();
            statusEl.style.display = 'none';

            if (!Array.isArray(submissions) || submissions.length === 0) {
                container.innerHTML = '<div class="card no-data"><h3>No submission records found inside data.json.</h3></div>';
                return;
            }

            submissions.slice().reverse().forEach(record => {
                const card = document.createElement('div');
                card.className = 'card';

                let itemsHtml = '';
                if (record.items && record.items.length > 0) {
                    itemsHtml = `
                        <table class="items-table">
                            <thead>
                                <tr>
                                    <th>Description</th>
                                    <th>Qty</th>
                                    <th>Unit Price</th>
                                    <th>Line Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${record.items.map(i => `
                                    <tr>
                                        <td>${escapeHtml(i.desc)}</td>
                                        <td>${escapeHtml(i.qty)}</td>
                                        <td>$${escapeHtml(i.price)}</td>
                                        <td>$${escapeHtml(i.total)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <h3 style="margin:0;">Submitted by: ${escapeHtml(record.name)}</h3>
                        <span style="font-size:13px; color:#64748b;">${escapeHtml(record.timestamp)}</span>
                    </div>

                    <div class="meta-group">
                        <div class="meta-item">
                            <strong>Department / Cost Center</strong>
                            ${escapeHtml(record.department)}
                        </div>
                        <div class="meta-item">
                            <strong>Vendor</strong>
                            ${escapeHtml(record.vendor)}
                        </div>
                        <div class="meta-item">
                            <strong>Attached Document</strong>
                            ${record.fileName ? escapeHtml(record.fileName) : 'None'}
                        </div>
                    </div>

                    <strong>Line Items:</strong>
                    ${itemsHtml}

                    <div class="total-row">
                        Grand Total: $${escapeHtml(record.grandTotal)}
                    </div>

                    <div style="margin-top: 15px;">
                        ${record.fileData ? `
                            <button class="btn-download" onclick="downloadAttachment('${record.fileData}', '${escapeHtml(record.fileName)}')">
                                📎 Download Attached Packet
                            </button>
                        ` : ''}
                        
                        <button class="btn-delete" onclick="deleteRecord(${record.id})">
                            🗑️ Delete Entry
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });

        } catch (err) {
            statusEl.className = 'status-msg';
            statusEl.style.background = '#fee2e2';
            statusEl.style.color = '#991b1b';
            statusEl.innerText = `Error loading data: ${err.message}`;
        }
    }

    async function deleteRecord(recordId) {
        if (!confirm("Are you sure you want to delete this entry?")) return;

        let token = CONFIG.pat;
        if (!token) {
            token = prompt("Enter your GitHub Personal Access Token (PAT) to authorize deletion:");
            if (!token) return;
        }

        const headers = {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json'
        };

        try {
            const res = await fetch(API_URL, { headers });
            if (!res.ok) throw new Error(`Failed to fetch repository data (Status: ${res.status})`);
            
            const fileData = await res.json();
            const currentSha = fileData.sha;

            const decodedBytes = Uint8Array.from(atob(fileData.content.replace(/\s/g, '')), c => c.charCodeAt(0));
            const decodedString = new TextDecoder().decode(decodedBytes);
            const submissions = JSON.parse(decodedString || '[]');

            const updatedSubmissions = submissions.filter(item => item.id !== recordId);

            const updatedJsonString = JSON.stringify(updatedSubmissions, null, 2);
            const updatedBase64 = btoa(unescape(encodeURIComponent(updatedJsonString)));

            const putRes = await fetch(API_URL, {
                method: 'PUT',
                headers: headers,
                body: JSON.stringify({
                    message: `Delete submission ID ${recordId}`,
                    content: updatedBase64,
                    sha: currentSha,
                    branch: CONFIG.branch
                })
            });

            if (!putRes.ok) throw new Error(`Failed to write update to GitHub (Status: ${putRes.status})`);

            alert("Entry deleted successfully!");
            loadSubmissions();

        } catch (err) {
            alert(`Error deleting record: ${err.message}`);
        }
    }

    function downloadAttachment(dataUrl, fileName) {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = fileName || 'attachment';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    window.onload = loadSubmissions;
</script>
</body>
</html>
